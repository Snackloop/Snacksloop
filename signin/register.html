<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加入零食小铺 - 注册</title>
    <style>
        /* 基础样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        /* 页面背景：与登录页保持一致的暖色调点阵 */
        body {
            background-color: #fdf6ec;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 0;
            background-image: radial-gradient(#ffe3c2 10%, transparent 11%);
            background-size: 20px 20px;
        }

        /* 注册卡片容器 */
        .register-container {
            background-color: #ffffff;
            padding: 35px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(212, 126, 32, 0.15);
            width: 100%;
            max-width: 420px;
            text-align: center;
            border: 2px solid #ffe3c2;
        }

        /* 品牌头部 */
        .brand-logo {
            font-size: 28px;
            font-weight: bold;
            color: #d47e20;
            margin-bottom: 10px;
        }

        .brand-slogan {
            font-size: 14px;
            color: #909399;
            margin-bottom: 25px;
        }

        /* 表单组 */
        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            color: #606266;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 11px 15px;
            border: 1.5px solid #dcdfe6;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s;
            outline: none;
        }

        /* 输入框聚焦效果 */
        .input-group input:focus {
            border-color: #e6a23c;
            box-shadow: 0 0 5px rgba(230, 162, 60, 0.3);
        }

        /* 条款勾选框 */
        .terms-group {
            display: flex;
            align-items: center;
            font-size: 13px;
            color: #606266;
            margin-bottom: 25px;
            text-align: left;
            cursor: pointer;
        }

        .terms-group input {
            margin-right: 8px;
            accent-color: #e6a23c;
        }

        .terms-group a {
            color: #d47e20;
            text-decoration: none;
        }

        .terms-group a:hover {
            text-decoration: underline;
        }

        /* 注册按钮 */
        .register-btn {
            width: 100%;
            padding: 12px;
            background-color: #e6a23c; /* 稍有区别的温暖橙黄色 */
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
        }

        .register-btn:hover {
            background-color: #d47e20;
        }

        .register-btn:active {
            transform: scale(0.98);
        }

        /* 返回登录提示 */
        .login-link {
            margin-top: 25px;
            font-size: 13px;
            color: #909399;
        }

        .login-link a {
            color: #d47e20;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="register-container">
        <div class="brand-logo">🍩 零食小铺</div>
        <div class="brand-slogan">加入会员，抢先解锁新品试吃福利！</div>

        <form action="#" method="POST">
            <div class="input-group">
                <label for="reg-username">会员昵称</label>
                <input type="text" id="reg-username" name="username" placeholder="给起一个可爱的名字吧" required>
            </div>

            <div class="input-group">
                <label for="reg-email">手机号 / 电子邮箱</label>
                <input type="text" id="reg-email" name="email" placeholder="用于接收发货通知" required>
            </div>

            <div class="input-group">
                <label for="reg-password">设置密码</label>
                <input type="password" id="reg-password" name="password" placeholder="请输入密码" required>
            </div>

            <div class="input-group">
                <label for="confirm-password">确认密码</label>
                <input type="password" id="confirm-password" name="confirm_password" placeholder="请再次输入密码" required>
            </div>

            <label class="terms-group">
                <input type="checkbox" name="terms" required>
                <span>我已阅读并同意 <a href="#">《会员隐私政策与服务协议》</a></span>
            </label>

            <button type="submit" class="register-btn">注册并领取新人优惠券</button>
        </form>

        <div class="login-link">
            已有账号？ <a href="login.html">直接登录</a>
        </div>
    </div>

</body>
</html>
